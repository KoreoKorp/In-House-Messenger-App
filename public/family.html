<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Chat with Jean</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:      #6B46C1;
      --purple-dark: #553C9A;
      --bg:          #F8F7F4;
      --white:       #FFFFFF;
      --text:        #1F2937;
      --text-soft:   #6B7280;
      --border:      #E5E7EB;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Loading ─────────────────────────────────────────────── */
    #loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      height: 100vh;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PIN Screen ──────────────────────────────────────────── */
    #pin-screen {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #6B46C1, #9333EA);
      padding: 20px;
    }

    .pin-card {
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    .pin-logo     { font-size: 52px; margin-bottom: 12px; }
    .pin-title    { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .pin-subtitle { font-size: 15px; color: var(--text-soft); margin-bottom: 24px; line-height: 1.4; }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 12px;
      min-height: 24px;
    }
    .pin-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      background: transparent;
      transition: all 0.15s;
    }
    .pin-dot.filled { background: var(--purple); border-color: var(--purple); }

    .pin-error {
      color: #DC2626;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      min-height: 20px;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .num-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 18px 10px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition: all 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .num-btn:active        { background: var(--purple); color: white; border-color: var(--purple); transform: scale(0.95); }
    .num-btn.action        { font-size: 18px; color: var(--text-soft); }
    .num-btn.submit        { background: var(--purple); color: white; border-color: var(--purple); }
    .num-btn.submit:active { background: var(--purple-dark); }

    /* ── Chat Screen ─────────────────────────────────────────── */
    #chat-screen { display: none; flex-direction: column; position: fixed; inset: 0; }

    #chat-header {
      background: var(--purple);
      color: white;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left       { display: flex; align-items: center; gap: 10px; }
    .status-dot        { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.35); flex-shrink: 0; transition: background 0.3s; }
    .status-dot.online { background: #4ADE80; }
    .header-name       { font-size: 18px; font-weight: 700; }
    .header-sub        { font-size: 13px; color: rgba(255,255,255,0.7); }

    #call-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #call-btn:hover { background: rgba(255,255,255,0.28); }

    #messages-container { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
    #messages           { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }

    .msg           { display: flex; flex-direction: column; max-width: 80%; }
    .msg.from-jean { align-self: flex-start; align-items: flex-start; }
    .msg.from-me   { align-self: flex-end;   align-items: flex-end; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
    }
    .from-jean .bubble { background: white; color: var(--text); border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .from-me   .bubble { background: var(--purple); color: white; border-bottom-right-radius: 4px; }

    .meta      { font-size: 11px; color: var(--text-soft); margin-top: 3px; }
    .read-tick { color: #60A5FA; }
    .date-sep  { text-align: center; font-size: 12px; color: var(--text-soft); padding: 8px 0; }

    #typing-indicator { padding: 4px 16px 8px; font-size: 13px; color: var(--text-soft); font-style: italic; min-height: 26px; }

    #input-area {
      padding: 12px 14px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: white;
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 120px;
      transition: border-color 0.15s;
    }
    #message-input:focus { border-color: var(--purple); }

    #send-btn {
      background: var(--purple);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      align-self: flex-end;
    }
    #send-btn:hover { background: var(--purple-dark); }

    /* ── Video Call Overlay ───────────────────────────────────── */
    #call-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
    }

    #remote-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #local-video  { position: absolute; bottom: 110px; right: 16px; width: 120px; height: 90px; border-radius: 10px; object-fit: cover; border: 2px solid rgba(255,255,255,0.4); z-index: 10; }

    #call-status-text {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      color: white; font-size: 20px; font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6); z-index: 10; white-space: nowrap;
    }

    #end-call-btn {
      position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
      background: #DC2626; color: white; border: none; border-radius: 40px;
      padding: 18px 52px; font-size: 20px; font-weight: 700; cursor: pointer;
      z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="spinner"></div>
  <div style="color:#9CA3AF;font-size:15px;">Connecting…</div>
</div>

<!-- PIN Screen -->
<div id="pin-screen">
  <div class="pin-card">
    <div class="pin-logo">💬</div>
    <div class="pin-title">Chat with Jean</div>
    <div class="pin-subtitle" id="pin-subtitle">Enter your PIN to connect</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
      <div class="pin-dot"></div>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <div class="numpad">
      <button class="num-btn" data-n="1">1</button>
      <button class="num-btn" data-n="2">2</button>
      <button class="num-btn" data-n="3">3</button>
      <button class="num-btn" data-n="4">4</button>
      <button class="num-btn" data-n="5">5</button>
      <button class="num-btn" data-n="6">6</button>
      <button class="num-btn" data-n="7">7</button>
      <button class="num-btn" data-n="8">8</button>
      <button class="num-btn" data-n="9">9</button>
      <button class="num-btn action" id="clear-btn">⌫</button>
      <button class="num-btn" data-n="0">0</button>
      <button class="num-btn action submit" id="submit-btn">→</button>
    </div>
  </div>
</div>

<!-- Chat Screen -->
<div id="chat-screen">
  <div id="chat-header">
    <div class="header-left">
      <div class="status-dot" id="status-dot"></div>
      <div>
        <div class="header-name">Jean</div>
        <div class="header-sub" id="header-sub">Connecting…</div>
      </div>
    </div>
    <button id="call-btn" title="Video call Jean">📞</button>
  </div>
  <div id="messages-container">
    <div id="messages"></div>
  </div>
  <div id="typing-indicator"></div>
  <div id="input-area">
    <textarea id="message-input" placeholder="Write a message…" rows="1"></textarea>
    <button id="send-btn">↑</button>
  </div>
</div>

<!-- Video Call Overlay -->
<div id="call-overlay">
  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video"  autoplay playsinline muted></video>
  <div id="call-status-text">Calling Jean…</div>
  <button id="end-call-btn">End Call</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── State ────────────────────────────────────────────────────
const identifier = window.location.pathname.split('/').filter(Boolean).pop();
let socket = null;
let requiresPin = false;
let pinValue = '';
let pc = null, localStream = null;
let isTyping = false, typingTimer;

// ── Boot ─────────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch('/api/room/' + encodeURIComponent(identifier));
    if (!res.ok) { showFatal('This chat link is not valid or has been removed.'); return; }
    const data  = await res.json();
    requiresPin = data.requiresPin;

    const savedToken = localStorage.getItem('jm_auth_' + identifier);
    if (savedToken) {
      startSocket(null, savedToken);
    } else if (requiresPin) {
      show('pin-screen', 'flex');
      hide('loading-screen');
    } else {
      startSocket(null, null);
    }
  } catch {
    showFatal('Could not connect. Please check your internet and try again.');
  }
}

// ── PIN numpad ────────────────────────────────────────────────
document.querySelectorAll('.num-btn[data-n]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    if (pinValue.length >= 12) return;
    pinValue += btn.dataset.n;
    renderDots();
  });
});

document.getElementById('clear-btn').addEventListener('click', function() {
  pinValue = pinValue.slice(0, -1);
  renderDots();
});

document.getElementById('submit-btn').addEventListener('click', function() {
  if (pinValue.length === 0) return;
  submitPin();
});

function renderDots() {
  var container = document.getElementById('pin-dots');
  var count = Math.max(4, pinValue.length);
  container.innerHTML = '';
  for (var i = 0; i < count; i++) {
    var dot = document.createElement('div');
    dot.className = 'pin-dot' + (i < pinValue.length ? ' filled' : '');
    container.appendChild(dot);
  }
}

function submitPin() {
  clearPinError();
  startSocket(pinValue, null);
}

function showPinError(msg) {
  document.getElementById('pin-error').textContent = msg;
  pinValue = '';
  renderDots();
}

function clearPinError() {
  document.getElementById('pin-error').textContent = '';
}

// ── Socket ────────────────────────────────────────────────────
function startSocket(pin, token) {
  hide('loading-screen');
  socket = io({ reconnectionDelay: 3000 });

  socket.on('connect', function() {
    socket.emit('family-connect', { roomId: identifier, pin: pin, token: token });
  });

  socket.on('pin-required', function() {
    show('pin-screen', 'flex');
    hide('loading-screen');
    hide('chat-screen');
  });

  socket.on('auth-error', function(msg) {
    if (document.getElementById('pin-screen').style.display !== 'none') {
      showPinError(msg);
    } else {
      localStorage.removeItem('jm_auth_' + identifier);
      socket.disconnect();
      socket = null;
      pinValue = '';
      renderDots();
      clearPinError();
      show('pin-screen', 'flex');
      hide('chat-screen');
    }
  });

  socket.on('auth-token', function(data) {
    localStorage.setItem('jm_auth_' + identifier, data.token);
  });

  socket.on('family-authenticated', function() {
    hide('pin-screen');
    hide('loading-screen');
    show('chat-screen', 'flex');
    loadHistory();
  });

  socket.on('jean-status', function(data) {
    document.getElementById('status-dot').className = 'status-dot' + (data.online ? ' online' : '');
    document.getElementById('header-sub').textContent = data.online ? 'Online' : 'Away';
  });

  socket.on('new-message', function(data) { appendMsg(data.message, true); });

  socket.on('jean-typing',         function() { document.getElementById('typing-indicator').textContent = 'Jean is typing…'; scrollBottom(); });
  socket.on('jean-stopped-typing', function() { document.getElementById('typing-indicator').textContent = ''; });
  socket.on('jean-read',           function() { document.querySelectorAll('.read-tick').forEach(function(el) { el.textContent = '✓✓'; }); });

  socket.on('call-answered', function(data) {
    if (!pc) return;
    pc.setRemoteDescription(new RTCSessionDescription(data.answer))
      .then(function() { document.getElementById('call-status-text').textContent = 'Connected'; })
      .catch(function() { endCall(); });
  });

  socket.on('ice-candidate', function(data) {
    if (pc && data.candidate) {
      pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(function() {});
    }
  });

  socket.on('call-ended',   function() { endCall(); });
  socket.on('call-declined', function() { endCall(); flashCallBtn('Not available right now'); });
  socket.on('call-failed',   function(data) { endCall(); flashCallBtn(data.reason || 'Call failed'); });
}

// ── Message history ───────────────────────────────────────────
function loadHistory() {
  fetch('/api/messages/' + encodeURIComponent(identifier))
    .then(function(res) { return res.ok ? res.json() : []; })
    .then(function(msgs) {
      var container = document.getElementById('messages');
      container.innerHTML = '';
      var lastDate = '';
      msgs.forEach(function(msg) {
        var d = new Date(msg.timestamp).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
        if (d !== lastDate) {
          lastDate = d;
          var sep = document.createElement('div');
          sep.className = 'date-sep';
          sep.textContent = d;
          container.appendChild(sep);
        }
        appendMsg(msg, false);
      });
      scrollBottom();
    })
    .catch(function() {});
}

function appendMsg(msg, scroll) {
  var isMe = msg.from === 'family';
  var div  = document.createElement('div');
  div.className = 'msg ' + (isMe ? 'from-me' : 'from-jean');
  var time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  div.innerHTML =
    '<div class="bubble">' + escHtml(msg.text) + '</div>' +
    '<div class="meta">' + time + (isMe ? ' <span class="read-tick">' + (msg.readByJean ? '✓✓' : '✓') + '</span>' : '') + '</div>';
  document.getElementById('messages').appendChild(div);
  if (scroll) scrollBottom();
}

function scrollBottom() {
  var c = document.getElementById('messages-container');
  c.scrollTop = c.scrollHeight;
}

// ── Send message ──────────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', sendMsg);
document.getElementById('message-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('message-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  if (!isTyping) { isTyping = true; if (socket) socket.emit('typing-start'); }
  clearTimeout(typingTimer);
  var self = this;
  typingTimer = setTimeout(function() { isTyping = false; if (socket) socket.emit('typing-stop'); }, 1500);
});

function sendMsg() {
  var input = document.getElementById('message-input');
  var text  = input.value.trim();
  if (!text || !socket) return;
  socket.emit('family-message', { text: text });
  appendMsg({ from: 'family', text: text, timestamp: new Date().toISOString(), readByJean: false }, true);
  input.value = '';
  input.style.height = 'auto';
  isTyping = false;
  clearTimeout(typingTimer);
  socket.emit('typing-stop');
}

// ── Video call ────────────────────────────────────────────────
document.getElementById('call-btn').addEventListener('click', startCall);
document.getElementById('end-call-btn').addEventListener('click', endCall);

function startCall() {
  if (pc) return;
  navigator.mediaDevices.getUserMedia({ video: true, audio: true })
    .catch(function() { return navigator.mediaDevices.getUserMedia({ video: false, audio: true }); })
    .then(function(stream) {
      localStream = stream;
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      localStream.getTracks().forEach(function(track) { pc.addTrack(track, localStream); });
      document.getElementById('local-video').srcObject = localStream;

      pc.ontrack = function(e) {
        document.getElementById('remote-video').srcObject = e.streams[0] || new MediaStream([e.track]);
      };
      pc.onicecandidate = function(e) {
        if (e.candidate) socket.emit('ice-candidate', { candidate: e.candidate.toJSON() });
      };
      pc.onconnectionstatechange = function() {
        if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) endCall();
      };

      return pc.createOffer();
    })
    .then(function(offer) {
      return pc.setLocalDescription(offer).then(function() { return offer; });
    })
    .then(function(offer) {
      socket.emit('call-jean', { offer: offer });
      document.getElementById('call-overlay').style.display = 'block';
      document.getElementById('call-status-text').textContent = 'Calling Jean…';
    })
    .catch(function() { flashCallBtn('Camera/mic access denied'); });
}

function endCall() {
  if (localStream) { localStream.getTracks().forEach(function(t) { t.stop(); }); localStream = null; }
  if (pc)          { pc.close(); pc = null; }
  if (socket)      socket.emit('call-ended', {});
  document.getElementById('call-overlay').style.display = 'none';
  document.getElementById('remote-video').srcObject = null;
  document.getElementById('local-video').srcObject  = null;
}

function flashCallBtn(msg) {
  var btn = document.getElementById('call-btn');
  btn.textContent = '⚠️';
  btn.title = msg;
  setTimeout(function() { btn.textContent = '📞'; btn.title = 'Video call Jean'; }, 4000);
}

// ── Helpers ───────────────────────────────────────────────────
function show(id, display) { document.getElementById(id).style.display = display || 'block'; }
function hide(id)          { document.getElementById(id).style.display = 'none'; }

function showFatal(msg) {
  document.body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:30px;text-align:center;font-family:sans-serif;">' +
    '<div><div style="font-size:52px;margin-bottom:16px;">😕</div>' +
    '<div style="font-size:18px;color:#374151;line-height:1.5;">' + msg + '</div></div></div>';
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();

if (window.visualViewport) {
  function syncViewport() {
    var chatScreen = document.getElementById('chat-screen');
    if (!chatScreen || chatScreen.style.display === 'none') return;
    chatScreen.style.top    = window.visualViewport.offsetTop + 'px';
    chatScreen.style.height = window.visualViewport.height + 'px';
    chatScreen.style.bottom = 'auto';
  }
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}
</script>
</body>
</html>
